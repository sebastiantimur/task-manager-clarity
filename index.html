<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Manager</title>
<style>
:root{color-scheme:light dark;--bg:#f5f5f5;--card:#fff;--text:#222;--line:#d8d8d8;--accent:#2459a6;--muted:#666}
@media(prefers-color-scheme:dark){:root{--bg:#171717;--card:#252525;--text:#f1f1f1;--line:#525252;--accent:#9cc2ff;--muted:#bbb}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Arial,sans-serif}.wrap{max-width:720px;margin:55px auto;padding:0 16px}.panel{background:var(--card);padding:26px;border:1px solid var(--line);border-radius:10px}h1{margin:0 0 5px;font-size:28px}p{margin:0 0 20px;color:var(--muted)}form{display:flex;gap:10px}input{min-width:0;flex:1;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--text);font:inherit}button{border:1px solid var(--line);border-radius:6px;cursor:pointer;background:var(--card);color:var(--text);font:inherit;padding:10px 14px;min-height:44px}button.primary{background:#2459a6;border-color:#2459a6;color:#fff}button:hover{filter:brightness(.94)}button:focus-visible,input:focus-visible{outline:3px solid #f1a727;outline-offset:2px}ul{list-style:none;padding:0;margin:20px 0 0}li{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}li:last-child{border-bottom:0}.task-text{flex:1;overflow-wrap:anywhere}.done .task-text{text-decoration:line-through;color:var(--muted)}.check{width:22px;height:22px;flex:none;accent-color:#2459a6}.delete{color:#b13030}#status{margin:16px 0 0;font-size:14px}#empty{margin:22px 0 0}.hint{font-size:13px;margin:12px 0 0}@media(max-width:480px){.wrap{margin:16px auto}.panel{padding:18px}h1{font-size:24px}form{flex-direction:column}form button{width:100%}li{gap:7px}.delete{padding:8px}}
</style>
</head>
<body><main class="wrap"><section class="panel" aria-labelledby="heading"><h1 id="heading">Task Manager</h1><p>Add a task, mark it complete, or delete it.</p><form id="task-form"><label for="task-input" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Task description</label><input id="task-input" type="text" placeholder="Enter a task" maxlength="250" required autocomplete="off"><button class="primary" type="submit">Add Task</button></form><p id="status" role="status" aria-live="polite"></p><ul id="task-list" aria-label="Tasks"></ul><p id="empty">No tasks yet. Add one above.</p><p class="hint">Tasks are stored locally in this browser when storage is available.</p><noscript><p role="alert">JavaScript is required for adding, completing, and deleting tasks.</p></noscript></section></main>
<script>
(function(){'use strict';
const KEY='simple-task-manager-v1';const form=document.getElementById('task-form');const input=document.getElementById('task-input');const list=document.getElementById('task-list');const status=document.getElementById('status');const empty=document.getElementById('empty');let storageWorks=true;let tasks=[];
function read(){try{const data=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(data)?data.filter(x=>x&&typeof x.text==='string'&&typeof x.id==='string').map(x=>({id:x.id,text:x.text,done:!!x.done})):[]}catch(e){storageWorks=false;return []}}
function save(){if(!storageWorks)return;try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){storageWorks=false}}
function message(){status.textContent=storageWorks?`${tasks.length} task${tasks.length===1?'':'s'} • ${tasks.filter(t=>t.done).length} completed`:`${tasks.length} task${tasks.length===1?'':'s'} • Storage unavailable: tasks will be lost when this page closes.`}
function render(){list.replaceChildren();tasks.forEach(t=>{const li=document.createElement('li');if(t.done)li.classList.add('done');const check=document.createElement('input');check.className='check';check.type='checkbox';check.checked=t.done;check.setAttribute('aria-label',`Mark ${t.text} complete`);check.addEventListener('change',()=>{t.done=check.checked;save();render()});const span=document.createElement('span');span.className='task-text';span.textContent=t.text;const del=document.createElement('button');del.className='delete';del.type='button';del.textContent='Delete';del.setAttribute('aria-label',`Delete ${t.text}`);del.addEventListener('click',()=>{tasks=tasks.filter(x=>x.id!==t.id);save();render()});li.append(check,span,del);list.append(li)});empty.hidden=tasks.length!==0;message()}
tasks=read();render();form.addEventListener('submit',e=>{e.preventDefault();const value=input.value.trim();if(!value)return;tasks.push({id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),text:value,done:false});save();render();form.reset();input.focus()});
})();
</script></body></html>
